# Production-shaped services (owner-approved 2026-10-31, D1). This is the only
# Compose file used on the VPS. Deploy in two steps (R19), so that a failed
# migration leaves the running API in place:
#
#   doppler run -- docker compose -f compose.yaml run --rm migrate
#   doppler run -- docker compose -f compose.yaml up -d --wait
#
# Local development adds compose.override.yaml automatically. Required values
# use ${VAR:?} with no default, so a missing secret fails before any container
# changes. This file never names a committed .env file (R13); in-network
# database URLs are built here from the passwords (D4).
x-postgres-image: &postgres-image postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
# One API image serves both the migrator and the API.
x-api-build: &api-build
  context: .
  dockerfile: docker/api.Dockerfile
  target: runtime

services:
  postgres:
    image: *postgres-image
    command: [postgres, -c, timezone=UTC]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      # Read only by docker/postgres/init/10-roles.sh on first initialization.
      DB_OWNER_PASSWORD: ${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}
      DB_APP_PASSWORD: ${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}
    volumes:
      - pgdata:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -t 2
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    stop_grace_period: 10s

  # Applies pending committed migrations as the owner role, then exits. The
  # API waits for it to succeed and never migrates itself (D6). A plain `up`
  # recreates the API before this finishes, hence the one-off first (R19).
  migrate:
    image: storage-minis-api:local
    build: *api-build
    command: [node, node_modules/@storage-minis/db/dist/migrate.js]
    restart: "no"
    environment:
      MIGRATION_DATABASE_URL: postgres://storage_minis_owner:${DB_OWNER_PASSWORD:?Set DB_OWNER_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      NODE_ENV: production
      TZ: UTC
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: storage-minis-api:local
    build: *api-build
    init: true
    restart: "no"
    stop_grace_period: 15s
    environment:
      DATABASE_URL: postgres://storage_minis_app:${DB_APP_PASSWORD:?Set DB_APP_PASSWORD}@postgres:5432/${POSTGRES_DB:?Set POSTGRES_DB}
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      TZ: UTC
      LOG_LEVEL: ${LOG_LEVEL:-info}
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(7000)}).then(r => {if (r.status !== 200) process.exitCode = 1;}).catch(() => {process.exitCode = 1;});"
      interval: 2s
      timeout: 8s
      start_period: 5s
      retries: 3

volumes:
  pgdata:
