x-postgres-image: &postgres-image postgres:18.6-bookworm@sha256:bbf83594798e144bff365a9c191c5d779f181fb3135902064ab8ff11918020fc
x-postgres-health: &postgres-health
  test:
    - CMD-SHELL
    - pg_isready -h 127.0.0.1 -U "$$POSTGRES_USER" -d "$$POSTGRES_DB" -t 2
  interval: 2s
  timeout: 3s
  retries: 20
  start_period: 5s

services:
  api:
    profiles: [api]
    image: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}-api:step4
    build:
      context: .
      dockerfile: docker/Dockerfile.api
      target: runtime
    init: true
    restart: "no"
    stop_grace_period: 15s
    environment:
      HOST: 0.0.0.0
      PORT: "3000"
      NODE_ENV: production
      TZ: UTC
      LOG_LEVEL: ${LOG_LEVEL:-info}
      DB_TARGET: ${DB_TARGET:-}
      PGHOST: ${PGHOST:-}
      PGPORT: ${PGPORT:-}
      PGDATABASE: ${PGDATABASE:-}
      PGUSER: ${PGUSER:-}
      PGPASSWORD: ${PGPASSWORD:-}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:3000/health/ready', {signal: AbortSignal.timeout(7000)}).then(r => {if (r.status !== 200) process.exitCode = 1;}).catch(() => {process.exitCode = 1;});"
      interval: 2s
      timeout: 8s
      start_period: 5s
      retries: 3

  postgres:
    image: *postgres-image
    command: [postgres, -c, timezone=UTC]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: storage_minis_dev
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck: *postgres-health
    stop_grace_period: 10s

  postgres_test:
    profiles: [test]
    image: *postgres-image
    command: [postgres, -c, timezone=UTC]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_DB: storage_minis_test
      POSTGRES_PASSWORD: ${POSTGRES_TEST_PASSWORD:-}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5434}:5432"
    tmpfs:
      - /var/lib/postgresql:size=536870912
    healthcheck: *postgres-health
    stop_grace_period: 10s

  postgres-client:
    profiles: [db-tools]
    image: *postgres-image
    entrypoint: [psql]
    stop_grace_period: 10s

  tooling:
    profiles: [tools]
    stop_grace_period: 10s
    image: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}-tooling:step1
    build:
      context: ./docker
      dockerfile: Dockerfile.tooling
    user: node
    working_dir: /workspace
    init: true
    environment:
      PNPM_CONFIG_STORE_DIR: /pnpm/store
    volumes:
      - type: bind
        source: .
        target: /workspace
      - type: volume
        source: dependencies
        target: /workspace/node_modules
        volume:
          nocopy: true
      - type: volume
        source: api-dependencies
        target: /workspace/apps/api/node_modules
        volume:
          nocopy: true
      - type: volume
        source: db-dependencies
        target: /workspace/packages/db/node_modules
        volume:
          nocopy: true
      - type: volume
        source: pnpm-store
        target: /pnpm/store
        volume:
          nocopy: true
      - type: volume
        source: turbo
        target: /workspace/.turbo
        volume:
          nocopy: true

  tooling-init:
    profiles: [tools]
    stop_grace_period: 10s
    image: ${COMPOSE_PROJECT_NAME:?Set a unique COMPOSE_PROJECT_NAME}-tooling:step1
    user: "0:0"
    working_dir: /
    command: [sh, /usr/local/bin/init-tooling-volumes]
    volumes:
      - type: volume
        source: dependencies
        target: /volumes/dependencies
        volume:
          nocopy: true
      - type: volume
        source: api-dependencies
        target: /volumes/api-dependencies
        volume:
          nocopy: true
      - type: volume
        source: db-dependencies
        target: /volumes/db-dependencies
        volume:
          nocopy: true
      - type: volume
        source: pnpm-store
        target: /volumes/pnpm-store
        volume:
          nocopy: true
      - type: volume
        source: turbo
        target: /volumes/turbo
        volume:
          nocopy: true

volumes:
  dependencies:
  api-dependencies:
  db-dependencies:
  pnpm-store:
  turbo:
  pgdata:
