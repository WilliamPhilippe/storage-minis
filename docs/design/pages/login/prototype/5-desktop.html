<!doctype html>
<!-- StorageMinis Login prototype (approved 2026-11-01). Visual reference only: build with antd 6 per docs/design/system/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sign in — desktop</title>
<link rel="stylesheet" href="../../../system/tokens.css">
</head>
<body>
<style>
html,body{margin:0}body{display:flex;justify-content:center;background:#e9ebee;padding:24px}

body{margin:0}
a{color:var(--info)}a:hover{color:var(--ink)}
.google-btn:hover{background:var(--ink-hover)}
.google-btn:focus-visible,.lang-btn:focus-visible{outline:2px solid var(--focus-ring);outline-offset:2px}
.lang-btn:hover{background:var(--surface-sunken)}
</style>
<div style="width: 1280px; height: 800px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; justify-content: flex-end; height: 64px; padding: 0 24px; box-sizing: border-box;">
    <button class="lang-btn" type="button" aria-label="Language: English" style="display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink); font: inherit; font-size: 14px; font-weight: 500; cursor: pointer;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
      English
    </button>
  </header>
  <main style="flex-grow: 1; display: flex; align-items: center; justify-content: center; padding-bottom: 64px;">
    <section aria-labelledby="signin-title" style="width: 400px; box-sizing: border-box; display: flex; flex-direction: column; gap: 32px; padding: 32px; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg);">
      <img src="../../../system/assets/logo/storageminis-logo.png" alt="StorageMinis" style="display: block; height: 28px; width: auto; align-self: flex-start;">
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <h1 id="signin-title" style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600;">Sign in</h1>
        <p style="margin: 0; font-size: 14px; line-height: 22px; color: var(--ink-muted);">Manage your inventory, purchases, sales and public catalog.</p>
      </div>
      <div style="display: flex; flex-direction: column; gap: 12px;">
        <a class="google-btn" href="2-opening-google.html" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 40px; border-radius: var(--radius-md); background: var(--ink); color: var(--on-ink); font-size: 14px; font-weight: 500; text-decoration: none;">
          <span aria-hidden="true" style="width: 18px; height: 18px; border-radius: var(--radius-full); background: var(--surface); color: var(--ink); display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700;">G</span>
          Continue with Google
        </a>
        <p style="margin: 0; font-size: 12px; line-height: 20px; color: var(--ink-muted); text-align: center;">Only Google accounts invited to an organization can sign in.</p>
      </div>
    </section>
  </main>
  <footer style="padding: 16px 24px; font-size: 12px; line-height: 20px; color: var(--ink-muted); text-align: center;">Shopping? Open the catalog link the seller shared with you.</footer>
</div>
</body>
</html>
