<!doctype html>
<!-- StorageMinis Login prototype (approved 2026-11-01). Visual reference only: build with antd 6 per docs/design/system/. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Opening Google — phone</title>
<link rel="stylesheet" href="../../../system/tokens.css">
</head>
<body>
<style>
html,body{margin:0}body{display:flex;justify-content:center;background:#e9ebee;padding:24px}

body{margin:0}
a{color:var(--info)}a:hover{color:var(--ink)}
</style>
<div style="width: 390px; height: 844px; box-sizing: border-box; display: flex; flex-direction: column; background: var(--surface-page); color: var(--ink); font-family: var(--font-sans);">
  <header style="display: flex; align-items: center; justify-content: flex-end; padding: 12px 8px 12px 16px;">
    <button type="button" disabled aria-label="Language: English" style="display: inline-flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 0; border-radius: var(--radius-md); background: transparent; color: var(--ink-disabled); font: inherit; font-size: 14px; font-weight: 500;">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"></circle><path d="M3 12h18M12 3c2.5 2.6 3.8 5.6 3.8 9s-1.3 6.4-3.8 9c-2.5-2.6-3.8-5.6-3.8-9S9.5 5.6 12 3z"></path></svg>
      English
    </button>
  </header>
  <main style="flex-grow: 1; display: flex; flex-direction: column; justify-content: center; gap: 32px; padding: 0 16px 96px;">
    <img src="../../../system/assets/logo/storageminis-logo.png" alt="StorageMinis" style="display: block; height: 28px; width: auto; align-self: flex-start;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <h1 style="margin: 0; font-size: 22px; line-height: 30px; font-weight: 600;">Sign in</h1>
      <p style="margin: 0; font-size: 16px; line-height: 24px; color: var(--ink-muted);">Manage your inventory, purchases, sales and public catalog.</p>
    </div>
    <div style="display: flex; flex-direction: column; gap: 12px;">
      <button type="button" disabled aria-busy="true" style="display: flex; align-items: center; justify-content: center; gap: 12px; height: 44px; border: 0; border-radius: var(--radius-md); background: var(--ink-hover); color: var(--on-ink); font: inherit; font-size: 16px; font-weight: 500;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="12" cy="12" r="8" stroke-opacity="0.3"></circle><path d="M12 4a8 8 0 0 1 8 8"></path></svg>
        Opening Google…
      </button>
      <p role="status" style="margin: 0; font-size: 12px; line-height: 20px; color: var(--ink-muted); text-align: center;">You'll come back here after choosing your account.</p>
    </div>
  </main>
  <footer style="padding: 16px; border-top: 1px solid var(--line); font-size: 12px; line-height: 20px; color: var(--ink-muted); text-align: center;">Shopping? Open the catalog link the seller shared with you.</footer>
</div>
</body>
</html>
